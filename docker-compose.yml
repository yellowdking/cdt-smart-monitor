services:
  cdt-smart-monitor:
    build: .
    image: cdt-smart-monitor:local
    container_name: cdt-smart-monitor
    user: "0:0"
    restart: unless-stopped
    init: true
    ports:
      - "43211:8080"
    environment:
      CDT_DATA_DIR: /data
      CDT_LISTEN: :8080
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data
